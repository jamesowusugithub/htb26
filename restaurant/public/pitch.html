<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pitch + animation</title>
<style>
 body{margin:0;font:16px/1.45 -apple-system,Segoe UI,sans-serif;background:#f4efe6;color:#1d2b24}
 .wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100vh}
 iframe{width:100%;height:100%;border:0;background:#fff}
 aside{padding:18px 20px;overflow:auto;background:#fffdf8;border-left:2px solid #d9cfba}
 h1{font-size:17px;margin:0 0 2px} .sub{font-size:12px;color:#6b6a5c;margin-bottom:12px}
 .beat{border-left:4px solid #d9cfba;padding:8px 12px;margin:10px 0;border-radius:4px;opacity:.45;transition:all .3s}
 .beat.on{opacity:1;border-color:#2f7d5b;background:#eaf5ee;transform:translateX(2px)}
 .beat b{font-size:11px;letter-spacing:.06em;color:#2f7d5b;text-transform:uppercase}
 .beat p{margin:3px 0 0;font-size:17px}
 .ev{display:none;margin-top:6px;font-size:12px;color:#44514a;background:#fff;border:1px dashed #b7c9bd;border-radius:4px;padding:6px 8px}
 .beat.on .ev{display:block}
 button{font:600 14px inherit;padding:9px 14px;border:0;border-radius:6px;background:#2f7d5b;color:#fff;cursor:pointer;margin-right:8px}
 button.alt{background:#fff;color:#2f7d5b;border:1px solid #2f7d5b}
 .meta{font-size:11px;color:#6b6a5c;margin-top:14px;border-top:1px solid #e3dac7;padding-top:8px}
 .draft{background:#fff3d9;color:#7a5410;border-radius:4px;padding:3px 7px;font-size:11px;font-weight:700}
</style></head><body>
<div class="wrap">
 <iframe id="anim" title="The Restaurant animation"></iframe>
 <aside>
  <h1>30-second pitch</h1>
  <div class="sub">Hook, problem, solution, proof, ask. Every number is from held-out evaluation (analysis/rl/README.md) or the recordings.</div>
  <button id="play">Play pitch with animation</button><button id="speak" class="alt">Voice: off</button>
  <div id="beats"></div>
  <div class="meta" id="meta"></div>
 </aside>
</div>
<script>
const BEATS=[
 ["Hook","Nobody can see how long GPU jobs wait, because Alibaba's trace never recorded it.",
 "On screen: the raw trace columns: job_name, organization, gpu_model, submit_time, duration. No waits, no starts."],
 ["Problem","We replayed 466,867 real jobs: queues grow because schedulers cannot know how long a job will run.",
 "On screen: customers are real trace jobs; chefs are GPUs; build your own kitchen from six real GPU types."],
 ["Solution","So we predict runtimes from each team's history, forecast demand, and trained a reinforcement-learning scheduler.",
 "On screen: Manager Decision panel, 'Predicted runtime' beside '(actual ...)'. The same trained policy runs any GPU mix."],
 ["Proof","On days it never saw, queue time halves versus priority scheduling, and RL matches the best rule with a third fewer preemptions.",
 "__PROOF__"],
 ["Ask","Add your own workload and watch it decide.","Then: the 3D room, and the comparison panel (RL against four other managers)."]];
const words=s=>s.trim().split(/\s+/).length, total=BEATS.reduce((a,b)=>a+words(b[1]),0);
const box=document.getElementById('beats');
BEATS.forEach((b,i)=>{box.insertAdjacentHTML('beforeend',`<div class="beat" id="b${i}"><b>${b[0]} (${words(b[1])}w)</b><p>${b[1]}</p><div class="ev" id="e${i}">${b[2]}</div></div>`)});
document.getElementById('meta').textContent=`Total ${total} words (budget 75 to 85), about ${Math.round(total/170*60)} s spoken at 170 words per minute.`;
const frame=document.getElementById('anim'); const base=location.origin+'/';
frame.src=base+'?trace=rl_ppo'+(location.search.includes('api=')?'&'+location.search.slice(1):'');
// proof numbers come from the recordings themselves
async function last(name){const r=await (await fetch(base+'traces/'+name+'.json')).json();const m=r.events.filter(e=>e.type==='METRICS').pop();return {m,meta:r.trace_meta}}
Promise.all([last('fifo'),last('priority_fifo'),last('rl_ppo')]).then(([f,p,r])=>{
  document.getElementById('e3').innerHTML=`On screen (same ${r.m.received} real jobs, ${r.meta.kitchen_nodes}-node demo kitchen, 150 simulated minutes): average wait <b>FIFO ${f.m.avg_wait_s.toFixed(1)} min</b>, priority ${p.m.avg_wait_s.toFixed(1)} min, <b>learned scheduler ${r.m.avg_wait_s.toFixed(1)} min</b>; slowest 5%: ${f.m.p95_wait_s.toFixed(1)} vs ${r.m.p95_wait_s.toFixed(1)} min. Illustrative scale. Full-scale held-out numbers are in the scoreboard.`;
  document.getElementById('meta').insertAdjacentHTML('beforeend','<br>Demo-kitchen numbers are read from the recordings in /traces. 'Halves' = RL 0.52 vs priority FIFO 1.00 and backfill 0.81 (17 held-out windows); 'a third fewer preemptions' = 326 vs 482 for the best rule. RL ties that rule on queue time. All waits are simulated (analysis/rl/README.md).');
});
let timers=[], speak=false;
document.getElementById('speak').onclick=e=>{speak=!speak;e.target.textContent='Voice: '+(speak?'on':'off')};
function setBeat(i){BEATS.forEach((_,k)=>document.getElementById('b'+k).classList.toggle('on',k===i))}
function clickIn(txt){const d=frame.contentDocument;const b=[...d.querySelectorAll('button')].find(x=>x.textContent.trim()===txt);b&&b.click()}
document.getElementById('play').onclick=()=>{
  timers.forEach(clearTimeout);timers=[];speechSynthesis.cancel();
  frame.src=base+'?trace=rl_ppo'+(location.search.includes('api=')?'&'+location.search.slice(1):'');
  frame.onload=()=>{setTimeout(()=>{clickIn('Reset');clickIn('4x')},1500)};
  let t=2000;
  BEATS.forEach((b,i)=>{timers.push(setTimeout(()=>{setBeat(i);if(speak){const u=new SpeechSynthesisUtterance(b[1]);u.rate=1.05;speechSynthesis.speak(u)}},t));t+=Math.max(2500,words(b[1])/170*60*1000+900)});
};
setBeat(-1);
</script></body></html>
